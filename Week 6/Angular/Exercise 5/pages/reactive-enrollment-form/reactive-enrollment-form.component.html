<form [formGroup]="enrollForm" (ngSubmit)="submit()">
<input formControlName="studentName" placeholder="Name">
<input formControlName="studentEmail" placeholder="Email">
<input formControlName="courseId" placeholder="Course ID">
<div *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">Course code starting with XX is not allowed.</div>
<div *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">Email taken.</div>
<select formControlName="preferredSemester"><option>Odd</option><option>Even</option></select>
<label><input type="checkbox" formControlName="agreeToTerms">Agree</label>

<div formArrayName="additionalCourses">
<div *ngFor="let ctrl of additionalCourses.controls;let i=index">
<input [formControl]="ctrl">
<button type="button" (click)="removeCourse(i)">Remove</button>
</div>
</div>

<button type="button" (click)="addCourse()">Add Another Course</button>
<button type="submit" [disabled]="enrollForm.invalid">Submit</button>
</form>
